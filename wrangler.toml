name = "arwuchivo"
main = "src/worker.js"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "arwuchivo.meowrhino.studio", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "arwuchivo-storage"
